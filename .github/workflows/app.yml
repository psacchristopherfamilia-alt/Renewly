name: app
on:
  push:
    paths: ["app/**", "supabase/**", "tests/db/**", "scripts/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "supabase/**", "tests/db/**", "scripts/**", ".github/workflows/app.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321", NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci" }

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-db.sh
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }

  e2e:
    runs-on: ubuntu-latest
    needs: [check, database]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.58.5 }
      - run: supabase start -x imgproxy,vector,postgres-meta,supavisor
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Build and start the app against local Supabase
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nAPP_URL=http://localhost:3200\n' "$API_URL" "${PUBLISHABLE_KEY:-$ANON_KEY}" > .env.local
          npm run build
          (npx next start -p 3200 &) && npx wait-on -t 60000 http://localhost:3200/api/health
          npx playwright test --trace off
